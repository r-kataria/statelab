services:
  earth:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: statelab-earth
    ports:
      - "8545:8545"
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--no-mining"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
      - "--gas-limit"
      - "30000000"
      - "--base-fee"
      - "0"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  mars:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: statelab-mars
    ports:
      - "8546:8546"
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8546"
      - "--chain-id"
      - "31338"
      - "--no-mining"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
      - "--gas-limit"
      - "30000000"
      - "--base-fee"
      - "0"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
